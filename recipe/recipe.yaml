schema_version: 1

context:
  python_min: "3.12"
  version: "0.32.0"

package:
  name: wsidicomizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wsidicomizer/wsidicomizer-${{ version }}.tar.gz
  sha256: a945e791d59d6c79331770a25af659dd83aa120e6a536ae30c8c68e0ac1718a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - wsidicomizer = wsidicomizer.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - wsidicom <0.37.0,<0.38.0
    - opentile >=0.27.0,<0.28.0
    - numpy >=1.22.0
    - pydicom >=3.0.0
    - czifile >=2026.3.12
    - tiffslide >=4.0.0,<5.0.0
    - click >=8.3.0,<9.0.0
    - universal-pathlib >=0.3.0,<1.0.0

tests:
  - python:
      imports:
        - wsidicomizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - wsidicomizer --help

about:
  summary: Tool for reading WSI files from proprietary formats and optionally convert them to to DICOM
  license: Apache-2.0
  license_file: LICENCE
  homepage: https://pypi.org/project/wsidicomizer/

extra:
  recipe-maintainers:
    - sarthakpati
