schema_version: 1

context:
  python_min: "3.12"
  version: "0.31.0"

package:
  name: wsidicomizer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wsidicomizer/wsidicomizer-${{ version }}.tar.gz
  sha256: 31bd819749142ebda5c2bc1fbbdcff23c5620ebe860eba035fe71fe5b6e93c07

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - wsidicomizer = wsidicomizer.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - wsidicom <0.37.0,>=0.36.1
    - opentile <0.27.0,>=0.26.0
    - numpy >=1.22.0
    - pydicom >=3.0.0
    - czifile >=2026.3.12
    - tiffslide >=4.0.0,<5.0.0
    - click >=8.3.0,<9.0.0

tests:
  - python:
      imports:
        - wsidicomizer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - wsidicomizer --help

about:
  summary: Tool for reading WSI files from proprietary formats and optionally convert them to to DICOM
  license: Apache-2.0
  license_file: LICENCE
  homepage: https://pypi.org/project/wsidicomizer/

extra:
  recipe-maintainers:
    - sarthakpati
